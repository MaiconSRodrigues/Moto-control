<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moto Control">
<link rel="manifest" href="manifest.webmanifest">
<title>Moto Control</title>
<style>
:root{
  --bg:#05070a;
  --panel:rgba(14,18,24,.90);
  --panel2:rgba(25,31,42,.92);
  --line:rgba(255,255,255,.11);
  --text:#f7f8fb;
  --muted:#8f9bad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#05070a;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}
body{
  background:
    radial-gradient(circle at 50% 120%,rgba(42,88,160,.20),transparent 38%),
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.06),transparent 26%),
    linear-gradient(135deg,#05070a 0%,#0b1017 55%,#040609 100%)
}
.wrap{
  min-height:100dvh;width:100vw;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:10px
}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.brand{display:flex;align-items:center;gap:10px}
.brand-title{font-size:17px;font-weight:750}
.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}
.state{
  font-size:10px;color:#b9c3d1;padding:6px 9px;border:1px solid var(--line);
  border-radius:999px;background:rgba(255,255,255,.035)
}
.grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
  gap:10px;min-height:0
}
.card{
  border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  box-shadow:0 15px 35px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.06);
  color:var(--text);text-decoration:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;min-height:0
}
.card:active{transform:scale(.96);filter:brightness(1.18)}
.icon{width:54px;height:54px;display:grid;place-items:center}
.icon svg{width:54px;height:54px}
.label{font-size:13px;font-weight:700}
.sub{font-size:9px;color:var(--muted);margin-top:-3px}
.spotify .icon{border-radius:50%;overflow:hidden}
.waze .icon{border-radius:15px;overflow:hidden;background:#fff}
.control .icon{border-radius:15px;background:rgba(255,255,255,.055);border:1px solid var(--line)}
.protec .icon{border-radius:16px;background:#000;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.footer{font-size:9px;color:#697586;text-align:center}
@media (orientation:portrait){
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div style="font-size:26px">🏍️</div>
      <div>
        <div class="brand-title">Moto Control</div>
        <div class="brand-sub">Painel local • iPhone</div>
      </div>
    </div>
    <div class="state">OFFLINE READY</div>
  </div>

  <div class="grid">
    <a class="card spotify" href="spotify://">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="32" fill="#1DB954"/>
          <path d="M16 23.5c11.2-3.1 23.5-2.1 33.3 3" fill="none" stroke="#08110b" stroke-width="5" stroke-linecap="round"/>
          <path d="M18.5 33c9.4-2.3 19.8-1.2 28.3 2.9" fill="none" stroke="#08110b" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M21 42.2c7.7-1.4 15.5-.2 22.8 3" fill="none" stroke="#08110b" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Spotify</div>
      <div class="sub">Abrir</div>
    </a>

    <a class="card waze" href="waze://">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="15" fill="#fff"/>
          <path d="M16.5 34c0-11.4 7.7-19.5 20.3-19.5 9.8 0 17 6.2 17 15.2 0 8.1-5.2 14.2-13.3 17.2-5.5 2.1-12.3 2.1-17.3-.8l-7.6 3.2 2.1-8.4c-1-2.2-1.3-4.4-1.2-6.9z" fill="#33CCFF"/>
          <circle cx="31" cy="30" r="2.2" fill="#0c2230"/>
          <circle cx="42.2" cy="30" r="2.2" fill="#0c2230"/>
          <path d="M30.8 38c4.2 3.1 8.5 3.1 12.4 0" fill="none" stroke="#0c2230" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="23.5" cy="48.3" r="4" fill="#263746"/>
          <circle cx="45.2" cy="48.3" r="4" fill="#263746"/>
        </svg>
      </div>
      <div class="label">Waze</div>
      <div class="sub">Navegação</div>
    </a>

    <a class="card" href="http://192.168.4.1">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="#050608" stroke="#d9dde4" stroke-width="2"/>
          <circle cx="32" cy="32" r="20" fill="#f5f5f5" stroke="#11151b" stroke-width="1.5"/>
          <path d="M32 12 A20 20 0 0 1 52 32 L32 32 Z" fill="#f4f4f4"/>
          <path d="M52 32 A20 20 0 0 1 32 52 L32 32 Z" fill="#58aeea"/>
          <path d="M32 52 A20 20 0 0 1 12 32 L32 32 Z" fill="#f4f4f4"/>
          <path d="M12 32 A20 20 0 0 1 32 12 L32 32 Z" fill="#58aeea"/>
          <text x="32" y="10.5" fill="#f8fafc" font-size="6.8" text-anchor="middle" font-family="Arial" font-weight="700">BMW</text>
        </svg>
      </div>
      <div class="label">Bloqueador</div>
      <div class="sub">BMW G 310 GS</div>
    </a>

    <a class="card protec" href="shortcuts://run-shortcut?name=Protec">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#000"/>
          <path d="M18 31c0-5 2.4-9.8 6.4-13.2L31 12l14 14-14 14-6.6-5.8C20.4 30.7 18 35.8 18 31z" fill="#8DE000"/>
          <path d="M37 7l19 19-19 19v-8l11-11-11-11z" fill="#8DE000"/>
        </svg>
      </div>
      <div class="label">Protec</div>
      <div class="sub">Portaria</div>
    </a>

    <a class="card control" href="shortcuts://x-callback-url/run-shortcut?name=Volume%20-&x-success=https%3A%2F%2Fmaiconsrodrigues.github.io%2FMoto-control%2F">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <path d="M14 27h10l12-10v30L24 37H14z" fill="#f7f8fb"/>
          <path d="M41 32h14" stroke="#f7f8fb" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Volume −</div>
      <div class="sub">Diminuir</div>
    </a>

    <a class="card control" href="shortcuts://x-callback-url/run-shortcut?name=Pr%C3%B3xima%20M%C3%BAsica&x-success=https%3A%2F%2Fmaiconsrodrigues.github.io%2FMoto-control%2F">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <path d="M17 17l27 15-27 15z" fill="#f7f8fb"/>
          <rect x="45" y="17" width="5" height="30" rx="2.5" fill="#f7f8fb"/>
        </svg>
      </div>
      <div class="label">Próxima</div>
      <div class="sub">Pular música</div>
    </a>

    <a class="card control" href="shortcuts://x-callback-url/run-shortcut?name=Volume%20%2B&x-success=https%3A%2F%2Fmaiconsrodrigues.github.io%2FMoto-control%2F">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <path d="M14 27h10l12-10v30L24 37H14z" fill="#f7f8fb"/>
          <path d="M47 23v18M38 32h18" stroke="#f7f8fb" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Volume +</div>
      <div class="sub">Aumentar</div>
    </a>

    <a class="card control" href="shortcuts://">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="22" fill="none" stroke="#f7f8fb" stroke-width="4"/>
          <path d="M32 20v24M20 32h24" stroke="#f7f8fb" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Atalhos</div>
      <div class="sub">Configurar</div>
    </a>
  </div>

  <div class="footer">Spotify • Waze • Bloqueador • Protec • Controles de mídia</div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
