<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moto Control">
<link rel="manifest" href="manifest.webmanifest">
<title>Moto Control</title>
<style>
:root{
  --panel:rgba(14,18,24,.90);
  --panel2:rgba(25,31,42,.92);
  --line:rgba(255,255,255,.11);
  --text:#f7f8fb;
  --muted:#8f9bad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}
body{
  background:
    radial-gradient(circle at 50% 120%,rgba(42,88,160,.20),transparent 38%),
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.06),transparent 26%),
    linear-gradient(135deg,#05070a 0%,#0b1017 55%,#040609 100%)
}
.wrap{
  height:100dvh;width:100vw;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:10px
}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.brand{display:flex;align-items:center;gap:10px}
.brand-title{font-size:17px;font-weight:750}
.brand-sub{font-size:11px;color:var(--muted)}
.state{font-size:10px;color:#b9c3d1;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035)}

.main{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:10px;
}
.apps{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:10px;
  min-height:0;
}
.side{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:10px;
  min-height:0;
}
.card{
  border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  box-shadow:0 15px 35px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.06);
  color:var(--text);text-decoration:none;
}
.app{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px
}
.app:active{transform:scale(.965);filter:brightness(1.16)}
.icon{width:66px;height:66px;display:grid;place-items:center}
.icon svg{width:66px;height:66px}
.label{font-size:16px;font-weight:750}
.sub{font-size:10px;color:var(--muted);margin-top:-4px}

.spotify .icon{border-radius:50%;overflow:hidden}
.waze .icon{border-radius:18px;overflow:hidden;background:#fff}
.protec .icon{border-radius:18px;background:#000;overflow:hidden}

.clock{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.time{font-size:48px;font-weight:760;letter-spacing:-2px;line-height:1}
.date{font-size:12px;color:var(--muted);margin-top:7px;text-transform:capitalize}

.weather{
  padding:14px 16px;display:flex;flex-direction:column;justify-content:center;
}
.weather-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.temp{font-size:34px;font-weight:760;letter-spacing:-1px}
.weather-icon{font-size:32px}
.condition{font-size:13px;font-weight:650;margin-top:2px}
.details{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.45}
.offline{font-size:9px;color:#7f8a99;margin-top:5px}
.footer{font-size:9px;color:#697586;text-align:center}

@media(orientation:portrait){
  .main{grid-template-columns:1fr;grid-template-rows:1.2fr .8fr}
  .side{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="brand">
    <div style="font-size:26px">🏍️</div>
    <div>
      <div class="brand-title">Moto Control</div>
      <div class="brand-sub">BMW G 310 GS</div>
    </div>
  </div>
  <div class="state">PAINEL LOCAL</div>
</div>

<div class="main">

  <div class="apps">

    <a class="card app spotify" href="spotify://">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="32" fill="#1DB954"/>
          <path d="M16 23.5c11.2-3.1 23.5-2.1 33.3 3" fill="none" stroke="#08110b" stroke-width="5" stroke-linecap="round"/>
          <path d="M18.5 33c9.4-2.3 19.8-1.2 28.3 2.9" fill="none" stroke="#08110b" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M21 42.2c7.7-1.4 15.5-.2 22.8 3" fill="none" stroke="#08110b" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Spotify</div>
      <div class="sub">Abrir música</div>
    </a>

    <a class="card app waze" href="waze://">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="15" fill="#fff"/>
          <path d="M16.5 34c0-11.4 7.7-19.5 20.3-19.5 9.8 0 17 6.2 17 15.2 0 8.1-5.2 14.2-13.3 17.2-5.5 2.1-12.3 2.1-17.3-.8l-7.6 3.2 2.1-8.4c-1-2.2-1.3-4.4-1.2-6.9z" fill="#33CCFF"/>
          <circle cx="31" cy="30" r="2.2" fill="#0c2230"/>
          <circle cx="42.2" cy="30" r="2.2" fill="#0c2230"/>
          <path d="M30.8 38c4.2 3.1 8.5 3.1 12.4 0" fill="none" stroke="#0c2230" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">Waze</div>
      <div class="sub">Navegação</div>
    </a>

    <a class="card app" href="http://192.168.4.1">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="#050608" stroke="#d9dde4" stroke-width="2"/>
          <circle cx="32" cy="32" r="20" fill="#f5f5f5" stroke="#11151b" stroke-width="1.5"/>
          <path d="M32 12 A20 20 0 0 1 52 32 L32 32 Z" fill="#f4f4f4"/>
          <path d="M52 32 A20 20 0 0 1 32 52 L32 32 Z" fill="#58aeea"/>
          <path d="M32 52 A20 20 0 0 1 12 32 L32 32 Z" fill="#f4f4f4"/>
          <path d="M12 32 A20 20 0 0 1 32 12 L32 32 Z" fill="#58aeea"/>
          <text x="32" y="10.5" fill="#f8fafc" font-size="6.8" text-anchor="middle" font-family="Arial" font-weight="700">BMW</text>
        </svg>
      </div>
      <div class="label">Bloqueador</div>
      <div class="sub">BMW G 310 GS</div>
    </a>

    <a class="card app protec" href="shortcuts://run-shortcut?name=Protec">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#000"/>
          <path d="M18 31c0-5 2.4-9.8 6.4-13.2L31 12l14 14-14 14-6.6-5.8C20.4 30.7 18 35.8 18 31z" fill="#8DE000"/>
          <path d="M37 7l19 19-19 19v-8l11-11-11-11z" fill="#8DE000"/>
        </svg>
      </div>
      <div class="label">Protec</div>
      <div class="sub">Portaria</div>
    </a>

  </div>

  <div class="side">

    <div class="card clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">---</div>
    </div>

    <div class="card weather">
      <div class="weather-top">
        <div>
          <div class="temp" id="temp">--°</div>
          <div class="condition" id="condition">Carregando clima...</div>
        </div>
        <div class="weather-icon" id="weatherIcon">⛅</div>
      </div>
      <div class="details" id="details">Localizando...</div>
      <div class="offline" id="offline"></div>
    </div>

  </div>

</div>

<div class="footer">Use a Siri para próxima música e controle de volume</div>
</div>

<script>
function updateClock(){
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent =
    now.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
}
updateClock();
setInterval(updateClock,1000);

const weatherMap = {
  0:["Céu limpo","☀️"],1:["Quase limpo","🌤️"],2:["Parcialmente nublado","⛅"],3:["Nublado","☁️"],
  45:["Neblina","🌫️"],48:["Neblina","🌫️"],51:["Garoa","🌦️"],53:["Garoa","🌦️"],55:["Garoa","🌧️"],
  61:["Chuva fraca","🌧️"],63:["Chuva","🌧️"],65:["Chuva forte","🌧️"],80:["Pancadas","🌦️"],
  81:["Pancadas","🌧️"],82:["Pancadas fortes","⛈️"],95:["Trovoadas","⛈️"],96:["Trovoadas","⛈️"],99:["Trovoadas fortes","⛈️"]
};

function renderWeather(data, cached=false){
  const c = data.current;
  const daily = data.daily;
  const code = weatherMap[c.weather_code] || ["Tempo local","🌡️"];
  document.getElementById("temp").textContent = Math.round(c.temperature_2m)+"°";
  document.getElementById("condition").textContent = code[0];
  document.getElementById("weatherIcon").textContent = code[1];
  let detail = `Sensação ${Math.round(c.apparent_temperature)}° • Umidade ${c.relative_humidity_2m}%`;
  if(daily && daily.temperature_2m_max){
    detail += ` • Máx ${Math.round(daily.temperature_2m_max[0])}° / Mín ${Math.round(daily.temperature_2m_min[0])}°`;
  }
  document.getElementById("details").textContent = detail;
  document.getElementById("offline").textContent = cached ? "Última previsão salva" : "Atualizado agora";
}

async function fetchWeather(lat,lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("weather");
  const data = await r.json();
  localStorage.setItem("motoWeather",JSON.stringify(data));
  renderWeather(data,false);
}

function loadCachedWeather(){
  const raw = localStorage.getItem("motoWeather");
  if(raw){
    try{renderWeather(JSON.parse(raw),true);return true}catch(e){}
  }
  document.getElementById("condition").textContent="Clima indisponível";
  document.getElementById("details").textContent="Conecte à internet para atualizar";
  return false;
}

function loadWeather(){
  if(!navigator.geolocation){loadCachedWeather();return;}
  navigator.geolocation.getCurrentPosition(
    p => fetchWeather(p.coords.latitude,p.coords.longitude).catch(loadCachedWeather),
    loadCachedWeather,
    {enableHighAccuracy:false,timeout:7000,maximumAge:600000}
  );
}
loadWeather();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
